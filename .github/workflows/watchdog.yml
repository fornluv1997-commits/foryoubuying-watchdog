name: SMS Gateway External Watchdog

# 외부 감시 (2026-09-30 개편):
# - 알림을 보내지 않는다. 결과는 run 결론(실패=어떤 검사가 exit 1)과 step 이름으로 남는다.
# - 메인 PC 의 아침 산출물 판정(scripts/gh_watchdog_check.py, OutcomeMonitor 09:20)이
#   지난 24시간 run·job API 를 읽어 대시보드 카드로 올린다.
# - step 이름(sms-server / mac-heartbeat / laptop-heartbeat)이 판정 키다. 바꾸면 그쪽도 같이 바꿀 것.
on:
  schedule:
    # 매시 1회: 두 잡을 한 잡으로 합쳐 무료 한도(private 2,000분/월) 안에 둔다.
    # 9/20~ 한도 초과(결제 차단)로 전 run 미실행이었다. 정시(:00)는 GitHub 혼잡 시간이라 :17.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: external-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SERVER_URL: ${{ secrets.SERVER_URL }}
      MAX_SILENCE_SEC: "1800"   # 맥 heartbeat 침묵 임계(30분)
      DOWN_RETRIES: "3"
      DOWN_BACKOFF_SEC: "10"
    steps:
      - name: sms-server
        id: sms
        shell: bash
        run: |
          set +e
          RESP="000"
          for i in $(seq 1 "$DOWN_RETRIES"); do
            RESP=$(curl -sS -m 15 -o "$RUNNER_TEMP/health.json" -w "%{http_code}" "$SERVER_URL/health" 2>/dev/null)
            [ "$RESP" = "200" ] && break
            echo "attempt $i: http=$RESP"
            sleep "$DOWN_BACKOFF_SEC"
          done
          echo "http_code=$RESP" >> "$GITHUB_OUTPUT"
          if [ "$RESP" != "200" ]; then
            MSG="FAIL sms-server: /health HTTP ${RESP} (${DOWN_RETRIES} tries)"
            echo "$MSG"; echo "- $MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK sms-server"

      - name: mac-heartbeat
        # 서버가 죽었으면 맥 상태는 알 수 없다 → 실패가 아니라 skipped 로 남긴다.
        if: always() && steps.sms.outputs.http_code == '200'
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          LAST_HB=$(jq -r '.last_heartbeat // 0' "$RUNNER_TEMP/health.json")
          LAST_HB=${LAST_HB%.*}
          MAC_ALIVE=$(jq -r '.mac_alive // false' "$RUNNER_TEMP/health.json")
          SILENCE=$((NOW - LAST_HB))
          if [ "$LAST_HB" -le 0 ] || [ "$SILENCE" -gt "$MAX_SILENCE_SEC" ]; then
            MSG="FAIL mac-heartbeat: silence=$((SILENCE / 60))m last_heartbeat=${LAST_HB} mac_alive=${MAC_ALIVE}"
            echo "$MSG"; echo "- $MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK mac-heartbeat silence=${SILENCE}s mac_alive=${MAC_ALIVE}"

      - name: laptop-heartbeat
        # 윈도우 노트북 dead-man's switch: 노트북 워치독(10분 주기)이 laptop-heartbeat 브랜치에
        # 타임스탬프를 force-push 한다. 커밋이 45분 넘게 낡았으면 실패.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HB_BRANCH: laptop-heartbeat
          MAX_STALE_SEC: "2700"   # 45분 (워치독 10분 주기 + 재부팅·일시 네트워크 흡수)
        run: |
          set -uo pipefail
          NOW=$(date +%s)
          if ! DATE_ISO=$(gh api "repos/${REPO}/branches/${HB_BRANCH}" --jq '.commit.commit.committer.date' 2>"$RUNNER_TEMP/gh.err"); then
            MSG="FAIL laptop-heartbeat: branch query failed: $(head -c 200 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
            echo "$MSG"; echo "- $MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          LAST=$(date -u -d "$DATE_ISO" +%s 2>/dev/null || echo 0)
          STALE=$((NOW - LAST))
          if [ "$LAST" -le 0 ] || [ "$STALE" -gt "$MAX_STALE_SEC" ]; then
            MSG="FAIL laptop-heartbeat: last=${DATE_ISO:-none} stale=$((STALE / 60))m (limit $((MAX_STALE_SEC / 60))m)"
            echo "$MSG"; echo "- $MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK laptop-heartbeat last=${DATE_ISO} stale=${STALE}s"
